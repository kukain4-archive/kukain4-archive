<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARTWORK ARCHIVE</title>
  <!-- style.cssを読み込む -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ヘッダー：プロフィール＆連絡先 -->
  <header>
    <h1 class="site-title">ARTWORK ARCHIVE</h1>
    <p class="profile-text">
      Abstract art based on Japanese calligraphy.
    </p>
    <div class="contact-links">
      <a href="#" target="_blank">Instagram</a>
      <a href="#" target="_blank">Contact / Email</a>
    </div>

    <!-- カレンダージャンプUI（headerの中に収めるか、外に出す） -->
    <div class="calendar-search">
      <label for="date-picker">JUMP TO DATE:</label>
      <input type="date" id="date-picker">
    </div>
  </header>

  <main>
    <!-- JavaScriptが自動で画像カードを生成して挿入するグリッド -->
    <div class="archive-grid" id="artwork-grid"></div>
  </main>

  <!-- スクリプトの読み込み（重複を解消） -->
  <script src="file_list.js"></script>
  <script src="script.js"></script>
</body>
</html>
