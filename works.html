<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WORKS — YOUR NAME</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 固定ヘッダー -->
  <header class="site-header">
    <div class="site-branding">
      <a href="index.html" class="site-title">YOUR NAME</a>
    </div>
    <nav class="site-nav">
      <a href="index.html">HOME</a>
      <a href="works.html" class="active">WORKS</a>
      <a href="about.html">ABOUT</a>
      <a href="contact.html">CONTACT</a>
    </nav>
  </header>

  <!-- メインコンテンツ（左右に十分な余白） -->
  <main class="main-container">
    <section class="archive-section">
      <div class="section-header">
        <h3 class="section-heading">WORKS ARCHIVE</h3>
        <!-- カレンダージャンプUI -->
        <div class="calendar-search">
          <label for="date-picker">JUMP TO DATE:</label>
          <input type="date" id="date-picker">
        </div>
      </div>

      <!-- 3列グリッド（JavaScriptが自動生成） -->
      <div class="archive-grid" id="artwork-grid"></div>
    </section>

  <!-- フッター -->
  <footer class="site-footer">
    <p>&copy; YOUR NAME. All rights reserved.</p>
  </footer>

  <!-- 右下固定Instagramアイコン -->
  <aside class="fixed-instagram">
    <a href="https://instagram.com/your-username" target="_blank" rel="noopener" aria-label="Instagram">
      <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
        <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
